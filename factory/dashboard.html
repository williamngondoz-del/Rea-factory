<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --mut:#6b6b66; --card:#fff; --line:#e2e2dd;
          --pass:#2f8f4e; --chg:#c0392b; --pend:#a8a8a0; --human:#d98a00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161615; --fg:#ececea; --mut:#9a9a94; --card:#20201f; --line:#34342f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 20px; display:flex; justify-content:space-between; align-items:baseline; }
  h1 { margin:0; font-size:18px; }
  #status { color:var(--mut); font-size:12px; }
  main { display:grid; grid-template-columns:repeat(6, minmax(150px, 1fr)); gap:12px; padding:0 20px 20px; overflow-x:auto; }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:0 0 8px; }
  .col.needs-human h2 { color:var(--human); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; cursor:pointer; }
  .card:hover { border-color:var(--mut); }
  .card.needs-human { border:2px solid var(--human); }
  .title { font-weight:600; }
  .meta { color:var(--mut); font-size:12px; margin-top:2px; }
  .chips { display:flex; gap:4px; flex-wrap:wrap; margin-top:8px; }
  .chip { font-size:11px; padding:2px 6px; border-radius:10px; color:#fff; background:var(--pend); }
  .chip.PASS { background:var(--pass); } .chip.CHANGES { background:var(--chg); }
  .empty { color:var(--mut); font-size:12px; }
  dialog { width:min(820px, 94vw); max-height:86vh; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--fg); padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.4); }
  .dhead { display:flex; justify-content:space-between; padding:12px 16px; border-bottom:1px solid var(--line); }
  .files { display:flex; gap:6px; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--line); }
  .files button, .dhead button { font:inherit; border:1px solid var(--line); background:transparent; color:var(--fg); border-radius:6px; padding:3px 8px; cursor:pointer; }
  .files button[aria-pressed="true"] { background:var(--fg); color:var(--bg); }
  pre { margin:0; padding:16px; overflow:auto; max-height:56vh; white-space:pre-wrap; font:12.5px/1.5 ui-monospace, monospace; }
</style>
</head>
<body>
<header><h1>Factory</h1><span id="status">loading…</span></header>
<main id="board"></main>
<dialog id="dlg">
  <div class="dhead"><strong id="dtitle"></strong><button id="close">Close</button></div>
  <div class="files" id="files"></div>
  <pre id="content">Pick a file.</pre>
</dialog>
<script>
const STAGES = [
  ["spec","Spec"],["build","Build"],["review","Review"],
  ["approve","Approve"],["needs-human","Needs human"],["merged","Merged"]
];
const REVIEWERS = ["security","ux","ui","code"];
const $ = (id) => document.getElementById(id);
let current = null, lastJson = "";

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function card(job) {
  const c = el("div", "card" + (job.stage === "needs-human" ? " needs-human" : ""));
  c.append(el("div", "title", job.title || job.id));
  c.append(el("div", "meta", job.id + (job.round ? " · round " + job.round : "")));
  if (job.stage === "review" || job.reviews) {
    const chips = el("div", "chips");
    for (const r of REVIEWERS) {
      const v = (job.reviews && job.reviews[r]) || "pending";
      chips.append(el("span", "chip " + v, r + ": " + v));
    }
    c.append(chips);
  }
  c.onclick = () => openJob(job);
  return c;
}

function render(board) {
  const root = $("board");
  root.replaceChildren();
  for (const [key, label] of STAGES) {
    const col = el("section", "col " + key);
    col.append(el("h2", "", label));
    const jobs = (board.jobs || []).filter((j) => j.stage === key);
    if (!jobs.length) col.append(el("div", "empty", "—"));
    jobs.forEach((j) => col.append(card(j)));
    root.append(col);
  }
}

async function poll() {
  try {
    const res = await fetch("board.json?t=" + Date.now(), { cache: "no-store" });
    const text = await res.text();
    if (text !== lastJson) { lastJson = text; render(JSON.parse(text)); }
    $("status").textContent = "updated " + new Date().toLocaleTimeString();
  } catch (e) {
    $("status").textContent = "cannot read board.json (serve this folder over http)";
  }
}

async function showFile(job, file, btn) {
  document.querySelectorAll("#files button").forEach((b) => b.setAttribute("aria-pressed", "false"));
  btn.setAttribute("aria-pressed", "true");
  $("content").textContent = "loading…";
  try {
    const res = await fetch("jobs/" + job.id + "/" + file + "?t=" + Date.now(), { cache: "no-store" });
    $("content").textContent = res.ok ? await res.text() : "not found: " + file;
  } catch (e) { $("content").textContent = "failed to load " + file; }
}

function openJob(job) {
  current = job;
  $("dtitle").textContent = (job.title || job.id) + " · " + job.stage;
  const box = $("files");
  box.replaceChildren();
  (job.files || []).forEach((f) => {
    const b = el("button", "", f);
    b.setAttribute("aria-pressed", "false");
    b.onclick = () => showFile(job, f, b);
    box.append(b);
  });
  $("content").textContent = (job.files || []).length ? "Pick a file." : "No files yet.";
  $("dlg").showModal();
  const first = box.querySelector("button");
  if (first) first.click();
}

$("close").onclick = () => $("dlg").close();
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
